[project]
name = "llm-eval-benchmark"
version = "0.1.0"
description = "A benchmarking and evaluation harness for comparing LLM candidates across factual, reasoning, instruction-following, and summarization-faithfulness tasks."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Samir Rafigzada", email = "rafigzadasamir@gmail.com" }]
keywords = ["llm", "evaluation", "benchmarking", "llm-as-judge", "anthropic"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "PyYAML>=6.0",
    "anthropic>=0.40.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.4", "ruff>=0.4"]

[project.scripts]
llm-eval-benchmark = "llm_eval_benchmark.run:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
llm_eval_benchmark = ["data/*.yaml"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
